<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CampusConnect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef4ff, #f8fbff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .register-box {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #1769ff;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #1769ff;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 10px;
            background: #1769ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #1769ff;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="register-box">

    <h1>CampusConnect</h1>

    <p class="subtitle">
        Create your student account
    </p>

    <form id="registerForm">

        <label>Full Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
        >

        <label>Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Student ID / Registration Number</label>
        <input
            type="text"
            id="studentId"
            placeholder="Example: 2501294175"
            required
        >

        <label>Course / Department</label>
        <select id="department" required>
            <option value="">Select Department</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Electronics">Electronics</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Civil">Civil</option>
            <option value="Electrical">Electrical</option>
        </select>

        <label>Semester</label>
        <select id="semester" required>
            <option value="">Select Semester</option>
            <option value="1st Semester">1st Semester</option>
            <option value="2nd Semester">2nd Semester</option>
            <option value="3rd Semester">3rd Semester</option>
            <option value="4th Semester">4th Semester</option>
            <option value="5th Semester">5th Semester</option>
            <option value="6th Semester">6th Semester</option>
            <option value="7th Semester">7th Semester</option>
            <option value="8th Semester">8th Semester</option>
        </select>

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Minimum 6 characters"
            required
        >

        <label>Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            required
        >

        <button type="submit" id="registerButton">
            Create Account →
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="index.html">Login</a>
    </div>

</div>


<script type="module">

import { auth, db } from "./firebase-config.js";

import {
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    doc,
    setDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const registerForm =
    document.getElementById("registerForm");

const registerButton =
    document.getElementById("registerButton");


registerForm.addEventListener("submit", async function(event) {

    event.preventDefault();


    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim().toLowerCase();

    const studentId =
        document.getElementById("studentId").value.trim();

    const department =
        document.getElementById("department").value;

    const semester =
        document.getElementById("semester").value;

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if (password.length < 6) {

        alert("Password must contain at least 6 characters.");

        return;
    }


    if (password !== confirmPassword) {

        alert("Passwords do not match.");

        return;
    }


    registerButton.disabled = true;

    registerButton.textContent = "Creating Account...";


    try {

        /* Firebase Authentication */

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            userCredential.user;


        /* Student data for Firestore */

        const studentData = {

            uid: user.uid,

            name: name,

            email: email,

            studentId: studentId,

            department: department,

            semester: semester,

            role: "student",

            createdAt: new Date().toISOString()

        };


        /* Save student in Firestore */

        await setDoc(
            doc(db, "users", user.uid),
            studentData
        );


        /* Save current user locally */

        localStorage.setItem(
            "currentUser",
            JSON.stringify(studentData)
        );


        alert("Registration successful!");


        /* Open dashboard */

        window.location.href =
            "dashboard.html";


    } catch (error) {

        console.error("Registration error:", error);


        let message = "Registration failed.";


        if (error.code === "auth/email-already-in-use") {

            message =
                "This email is already registered. Please login.";

        }
        else if (error.code === "auth/invalid-email") {

            message =
                "Please enter a valid email address.";

        }
        else if (error.code === "auth/weak-password") {

            message =
                "Password must contain at least 6 characters.";

        }
        else if (error.code === "auth/api-key-not-valid") {

            message =
                "Firebase API Key is invalid. Please check firebase-config.js.";

        }
        else {

            message =
                "Registration failed: " + error.message;

        }


        alert(message);


        registerButton.disabled = false;

        registerButton.textContent =
            "Create Account →";

    }

});

</script>

</body>
</html>

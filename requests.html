<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Requests - CampusConnect</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}

.navbar{
    background:#1746d1;
    color:white;
    padding:18px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#a9c1ff;
}

.nav-links a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

.container{
    width:90%;
    max-width:1100px;
    margin:30px auto;
}

h1{
    color:#172033;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin:25px 0;
}

.box{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 15px rgba(0,0,0,0.08);
}

.box p{
    color:#667085;
    margin:0 0 10px;
}

.number{
    font-size:30px;
    font-weight:bold;
    color:#1746d1;
}

.request{
    background:white;
    padding:22px;
    margin-bottom:18px;
    border-radius:15px;
    box-shadow:0 3px 15px rgba(0,0,0,0.08);
}

.request h2{
    margin-top:0;
}

.status{
    display:inline-block;
    padding:7px 14px;
    border-radius:20px;
    font-weight:bold;
    background:#fff3cd;
    color:#856404;
}

.status.approved{
    background:#dcfce7;
    color:#166534;
}

.status.rejected{
    background:#fee2e2;
    color:#991b1b;
}

.empty{
    background:white;
    padding:50px;
    text-align:center;
    border-radius:15px;
}

.loading{
    background:white;
    padding:40px;
    text-align:center;
    border-radius:15px;
    color:#667085;
}

.btn{
    display:inline-block;
    margin-top:15px;
    padding:10px 18px;
    background:#1746d1;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

@media(max-width:700px){

    .summary{
        grid-template-columns:1fr;
    }

    .navbar{
        flex-direction:column;
        gap:10px;
    }
}
</style>

</head>

<body>

<nav class="navbar">

    <div class="logo">
        Campus<span>Connect</span>
    </div>

    <div class="nav-links">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="services.html">
            Services
        </a>

    </div>

</nav>


<div class="container">

    <h1>
        📋 My Requests
    </h1>


    <div class="summary">

        <div class="box">

            <p>
                Total Requests
            </p>

            <div
                class="number"
                id="total">
                0
            </div>

        </div>


        <div class="box">

            <p>
                Pending
            </p>

            <div
                class="number"
                id="pending">
                0
            </div>

        </div>


        <div class="box">

            <p>
                Approved
            </p>

            <div
                class="number"
                id="approved">
                0
            </div>

        </div>

    </div>


    <div id="requestList">

        <div class="loading">
            Loading requests...
        </div>

    </div>

</div>


<!-- FIREBASE -->

<script type="module">

import { auth, db } from "./firebase-config.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   SHOW REQUESTS
========================================== */

function displayRequests(requests){

    const list =
        document.getElementById(
            "requestList"
        );


    /* SUMMARY */

    const total =
        requests.length;


    const pending =
        requests.filter(
            request =>
                String(
                    request.status || "Pending"
                ).toLowerCase()
                === "pending"
        ).length;


    const approved =
        requests.filter(
            request =>
                String(
                    request.status || ""
                ).toLowerCase()
                === "approved"
        ).length;


    document.getElementById(
        "total"
    ).textContent =
        total;


    document.getElementById(
        "pending"
    ).textContent =
        pending;


    document.getElementById(
        "approved"
    ).textContent =
        approved;


    /* NO REQUESTS */

    if(requests.length === 0){

        list.innerHTML = `

            <div class="empty">

                <h2>
                    📭 No Requests Found
                </h2>

                <p>
                    You have not submitted any
                    campus service request yet.
                </p>

                <a
                    href="services.html"
                    class="btn">
                    Apply for Service
                </a>

            </div>

        `;

        return;

    }


    /* SORT NEWEST FIRST */

    requests.sort(
        (a,b) =>
            new Date(
                b.createdAt || 0
            )
            -
            new Date(
                a.createdAt || 0
            )
    );


    /* DISPLAY */

    list.innerHTML =
        requests.map(
            request => {

                const status =
                    request.status ||
                    "Pending";


                const statusClass =
                    String(status)
                    .toLowerCase();


                return `

                <div class="request">

                    <h2>
                        ${escapeHTML(
                            request.type ||
                            "Campus Service Request"
                        )}
                    </h2>


                    <p>

                        <b>
                            Request ID:
                        </b>

                        ${escapeHTML(
                            request.id ||
                            "Firebase Request"
                        )}

                    </p>


                    <p>

                        <b>
                            Student:
                        </b>

                        ${escapeHTML(
                            request.studentName ||
                            "Student"
                        )}

                    </p>


                    <p>

                        <b>
                            Date:
                        </b>

                        ${escapeHTML(
                            request.date ||
                            "-"
                        )}

                    </p>


                    <p>

                        <b>
                            Details:
                        </b>

                        ${escapeHTML(
                            request.description ||
                            "No details"
                        )}

                    </p>


                    <span
                        class="status ${statusClass}">

                        ${escapeHTML(status)}

                    </span>

                </div>

                `;

            }
        ).join("");

}


/* ==========================================
   AUTH CHECK + FIREBASE REQUESTS
========================================== */

onAuthStateChanged(
    auth,
    (user)=>{

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        /*
          Only current student's requests
        */

        const requestsRef =
            collection(
                db,
                "requests"
            );


        const requestsQuery =
            query(
                requestsRef,
                where(
                    "studentUid",
                    "==",
                    user.uid
                )
            );


        /*
          REAL-TIME LISTENER
        */

        onSnapshot(

            requestsQuery,

            (snapshot)=>{

                const requests = [];


                snapshot.forEach(
                    docSnap=>{

                        requests.push({

                            id:docSnap.id,

                            ...docSnap.data()

                        });

                    }
                );


                displayRequests(
                    requests
                );

            },

            (error)=>{

                console.error(
                    "Requests Firebase error:",
                    error
                );


                document.getElementById(
                    "requestList"
                ).innerHTML = `

                    <div class="empty">

                        <h2>
                            ⚠️ Error
                        </h2>

                        <p>
                            Requests load nahi ho paaye.
                        </p>

                        <p>
                            ${escapeHTML(
                                error.message
                            )}
                        </p>

                    </div>

                `;

            }

        );

    }

);

</script>

</body>
</html>
